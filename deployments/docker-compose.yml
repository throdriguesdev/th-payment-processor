services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_MAX_CONNECTIONS=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --tcp-keepalive 60 --timeout 30
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OpenTelemetry Collector (for span metrics)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    ports:
      - "4319:4317"   # OTLP gRPC (avoid conflict with Tempo)
      - "4320:4318"   # OTLP HTTP (avoid conflict with Tempo)
      - "8889:8889"   # Prometheus metrics
    volumes:
      - ./otel-collector.yml:/etc/otel-collector.yml:ro
    command: ["--config=/etc/otel-collector.yml"]
    networks:
      - backend
    depends_on:
      - prometheus
      - tempo

  # Grafana Tempo
  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command: ["-config.file=/etc/tempo.yml"]
    networks:
      - backend

  # Loki
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  # Promtail (Log shipper)
  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - backend

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - backend
    depends_on:
      - prometheus
      - tempo
      - loki
  # nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - backend
      - payment-processor

  # backend App Instance 1
  app1:
    build:
      context: ..
      dockerfile: build/Dockerfile
    ports:
      - "8081:8080"
      - "2113:2112"
    environment:
      - SERVER_PORT=8080
      - DEFAULT_PROCESSOR_URL=http://payment-processor-default:8080
      - FALLBACK_PROCESSOR_URL=http://payment-processor-fallback:8080
      - TEMPO_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=payments
      - POSTGRES_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - LOG_LEVEL=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "app1|{{.ImageName}}|{{.Name}}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - payment-processor

  # backend App Instance 2
  app2:
    build:
      context: ..
      dockerfile: build/Dockerfile
    ports:
      - "8082:8080"
      - "2114:2112"
    environment:
      - SERVER_PORT=8080
      - DEFAULT_PROCESSOR_URL=http://payment-processor-default:8080
      - FALLBACK_PROCESSOR_URL=http://payment-processor-fallback:8080
      - TEMPO_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=payments
      - POSTGRES_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - LOG_LEVEL=info
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "app2|{{.ImageName}}|{{.Name}}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - payment-processor

  # Default Payment Processor (lower fee)
  payment-processor-default:
    build:
      context: ../payment-processors
    ports:
      - "8001:8080"
      - "2115:2112"
    environment:
      - PORT=8080
      - FEE_PERCENTAGE=1.0
      - MIN_RESPONSE_TIME=50
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "payment-processor-default|{{.ImageName}}|{{.Name}}"
    networks:
      - payment-processor
      - backend

  # Fallback Payment Processor (higher fee)
  payment-processor-fallback:
    build:
      context: ../payment-processors
    ports:
      - "8002:8080"
      - "2116:2112"
    environment:
      - PORT=8080
      - FEE_PERCENTAGE=5.0
      - MIN_RESPONSE_TIME=100
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "payment-processor-fallback|{{.ImageName}}|{{.Name}}"
    networks:
      - payment-processor
      - backend

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:

networks:
  backend:
    driver: bridge
  payment-processor:
    driver: bridge