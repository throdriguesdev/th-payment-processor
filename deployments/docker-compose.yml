version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=payments
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "80MB"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 50mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "60MB"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Jaeger
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - backend
  # nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "30MB"
    networks:
      - backend
      - payment-processor

  # backend App Instance 1
  app1:
    build:
      context: ..
      dockerfile: build/Dockerfile
    environment:
      - SERVER_PORT=8080
      - DEFAULT_PROCESSOR_URL=http://payment-processor-default:8080
      - FALLBACK_PROCESSOR_URL=http://payment-processor-fallback:8080
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=payments
      - POSTGRES_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "90MB"
    networks:
      - backend
      - payment-processor

  # backend App Instance 2
  app2:
    build:
      context: ..
      dockerfile: build/Dockerfile
    environment:
      - SERVER_PORT=8080
      - DEFAULT_PROCESSOR_URL=http://payment-processor-default:8080
      - FALLBACK_PROCESSOR_URL=http://payment-processor-fallback:8080
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=payments
      - POSTGRES_SSLMODE=disable
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "90MB"
    networks:
      - backend
      - payment-processor

  # Default Payment Processor (lower fee)
  payment-processor-default:
    build:
      context: ../payment-processors
    ports:
      - "8001:8080"
    environment:
      - PORT=8080
      - FEE_PERCENTAGE=1.0
      - MIN_RESPONSE_TIME=50
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "100MB"
    networks:
      - payment-processor

  # Fallback Payment Processor (higher fee)
  payment-processor-fallback:
    build:
      context: ../payment-processors
    ports:
      - "8002:8080"
    environment:
      - PORT=8080
      - FEE_PERCENTAGE=5.0
      - MIN_RESPONSE_TIME=100
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "100MB"
    networks:
      - payment-processor

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
  payment-processor:
    driver: bridge