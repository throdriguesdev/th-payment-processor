receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

  # Resource processor to ensure service name attributes
  resource:
    attributes:
      - key: service.namespace
        value: "th-payment-system"
        action: upsert

  # Attributes processor to enhance spans
  attributes:
    actions:
      - key: service.name
        action: upsert
        from_attribute: service.name
      - key: http.method
        action: upsert
        from_attribute: http.method
      - key: http.status_code
        action: upsert
        from_attribute: http.status_code

exporters:
  # Export to Tempo (will generate service graph metrics)
  otlp/tempo:
    endpoint: http://tempo:4317
    tls:
      insecure: true

  # Debug logging
  debug:
    verbosity: detailed

service:
  extensions: []
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [otlp/tempo, debug]

  telemetry:
    logs:
      level: "debug"