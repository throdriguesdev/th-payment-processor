apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Grafana Tempo for tracing
  - name: Tempo
    type: tempo
    access: proxy
    uid: tempo
    url: http://tempo:3200
    editable: true
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: loki
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [
          { key: 'service_name', value: 'service_name' },
          { key: 'http_method', value: 'http_method' },
          { key: 'http_status_code', value: 'http_status_code' }
        ]
        queries:
          - name: 'Request Rate'
            query: 'sum(rate(traces_service_graph_request_total{$$__tags}[5m]))'
          - name: 'Request Duration P99'
            query: 'histogram_quantile(0.99, sum(rate(traces_service_graph_request_duration_seconds_bucket{$$__tags}[5m])) by (le))'
          - name: 'Request Duration P95'  
            query: 'histogram_quantile(0.95, sum(rate(traces_service_graph_request_duration_seconds_bucket{$$__tags}[5m])) by (le))'
          - name: 'Error Rate'
            query: 'sum(rate(traces_service_graph_request_failed_total{$$__tags}[5m])) / sum(rate(traces_service_graph_request_total{$$__tags}[5m]))'
          - name: 'Span Metrics Rate'
            query: 'sum(rate(traces_spanmetrics_latency_count{$$__tags}[5m]))'

  # Loki for logs
  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://loki:3100
    editable: true

