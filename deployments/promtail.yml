server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # Application logs from payment services
  - job_name: payment-processor
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-processor
          service: payment-processor

    pipeline_stages:
      - json:
          expressions:
            level:
            msg:
            correlation_id:
            trace_id:
            span_id:
            service_name:
            time:
      - timestamp:
          format: RFC3339Nano
          source: time
      - labels:
          level:
          service_name:
          correlation_id:
      - output:
          source: msg