server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - simplified configuration
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      # Parse Docker log format
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            time: time
      
      # Extract container info from attributes
      - json:
          expressions:
            tag: tag
          source: attrs
      
      # Extract container name from tag
      - regex:
          expression: (?P<container_name>(?:[^|]*))\|
          source: tag
      
      # Set timestamp
      - timestamp:
          format: RFC3339Nano
          source: time
      
      # Try to parse application JSON logs
      - json:
          expressions:
            level: level
            message: message
            msg: msg
            service_name: service_name
            correlation_id: correlation_id
            trace_id: trace_id
            span_id: span_id
            component: component
            operation: operation
            http_method: http_method
            http_status: http_status
            payment_id: payment_id
            processor: processor
            amount: amount
            status: status
            latency_ms: latency_ms
            error: error
          source: output
      
      # Set labels for filtering
      - labels:
          stream:
          container_name:
          level:
          service_name:
          component:
          correlation_id:
      
      # Output the log message
      - output:
          source: output